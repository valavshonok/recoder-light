services:
  screen-recorder:
    build: .
    container_name: screen-recorder
    restart: unless-stopped

    expose:
      - "3000"

    volumes:
      - ./recordings:/app/recordings

  nginx:
    image: nginx:alpine
    container_name: screen-recorder-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - screen-recorder

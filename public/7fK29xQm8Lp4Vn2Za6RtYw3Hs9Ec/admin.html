<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin — Screen Recorder</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1100px;
        margin: 40px auto;
        padding: 20px;
      }

      h1 {
        margin-bottom: 10px;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 25px;
      }

      button {
        padding: 10px 16px;
        cursor: pointer;
        border: 1px solid #ccc;
        background: white;
        border-radius: 5px;
      }

      button:hover {
        background: #f5f5f5;
      }

      .danger {
        background: #d93025;
        color: white;
        border-color: #d93025;
      }

      .danger:hover {
        background: #b3261e;
      }

      .download {
        background: #1a73e8;
        color: white;
        border-color: #1a73e8;
        text-decoration: none;
        display: inline-block;
        padding: 8px 12px;
        border-radius: 5px;
      }

      .download:hover {
        background: #1557b0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        text-align: left;
        vertical-align: middle;
      }

      th {
        background: #f5f5f5;
      }

      .filename {
        word-break: break-word;
      }

      .actions {
        white-space: nowrap;
      }

      .empty {
        text-align: center;
        padding: 40px;
        color: #777;
      }

      #status {
        margin-bottom: 15px;
        padding: 12px;
        background: #f1f1f1;
        border-radius: 5px;
      }

      @media (max-width: 700px) {
        .top {
          flex-direction: column;
          align-items: stretch;
        }

        table {
          font-size: 14px;
        }

        th:nth-child(2),
        td:nth-child(2),
        th:nth-child(3),
        td:nth-child(3) {
          display: none;
        }
      }

      .filters {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .filters input {
        flex: 1;
        box-sizing: border-box;
        padding: 10px 12px;
        font-size: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      .filters select {
        padding: 10px 12px;
        font-size: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: white;
      }

      @media (max-width: 700px) {
        .filters {
          flex-direction: column;
        }
      }

      .storage-usage {
        margin-top: 10px;
        font-size: 18px;
        font-weight: 700;
      }

      .storage-usage.warning {
        color: #f57c00;
      }

      .storage-usage.danger {
        color: #d93025;
      }
    </style>
  </head>

  <body>
    <div class="top">
      <div>
        <h1>Админ-панель</h1>
        <div id="fileCount">Файлов: 0</div>
        <div id="storageUsage" class="storage-usage">Занято: 0 GB / 30 GB</div>
      </div>

      <div>
        <button id="refreshButton">Обновить</button>

        <button id="deleteAllButton" class="danger">Удалить все файлы</button>
      </div>
    </div>

    <div id="status">Загрузка...</div>

    <div class="filters">
      <input
        id="filterInput"
        type="text"
        placeholder="Фильтр по названию файла..."
      />

      <select id="sortSelect">
        <option value="asc">Название: А → Я</option>
        <option value="desc">Название: Я → А</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>Файл</th>
          <th>Размер</th>
          <th>Дата</th>
          <th>Действия</th>
        </tr>
      </thead>

      <tbody id="filesTableBody"></tbody>
    </table>

    <script src="/7fK29xQm8Lp4Vn2Za6RtYw3Hs9Ec/admin.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Screen Recorder</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 50px auto;
        padding: 20px;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin-bottom: 15px;
        font-size: 16px;
      }

      button {
        padding: 12px 20px;
        margin-right: 10px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #status {
        margin-top: 20px;
        padding: 15px;
        background: #f1f1f1;
      }

      .log {
        margin-top: 20px;
        padding: 10px 14px;
        height: 180px;
        overflow-y: auto;
        box-sizing: border-box;
        background: #f5f5f5;
        border: 1px solid #e0e0e0;
        border-radius: 5px;
        font-size: 13px;
        color: #777;
      }

      .log-entry {
        padding: 4px 0;
        line-height: 1.4;
      }

      .log-entry.error {
        color: #a66;
      }

      .log-entry.success {
        color: #687;
      }
    </style>
  </head>

  <body>
    <h1>Запись экрана</h1>

    <div>
      Примеры названия:
      <div>КТбо1-10 Иванов Иван Иванович Тест</div>
      <div>КТбо1-10 Иванов Иван Иванович Лаба</div>
    </div>

    <br />

    <input
      id="recordingName"
      type="text"
      maxlength="200"
      placeholder="Название записи"
    />

    <div>
      <button id="startButton" type="button">Начать запись</button>

      <button id="stopButton" type="button" disabled>Остановить запись</button>
    </div>

    <div id="log" class="log">
      <div class="log-entry">Готов к записи</div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
